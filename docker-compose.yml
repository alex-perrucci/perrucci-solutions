name: perrucci-solutions

services:
  perrucci-marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    expose:
      - "8000"
    networks:
      - shared_edge

  perrucci-web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MARKETING_API_URL: ${NEXT_PUBLIC_MARKETING_API_URL:-https://api.perruccisolutions.com}
    restart: unless-stopped
    depends_on:
      - perrucci-marketing
    expose:
      - "80"
    networks:
      - shared_edge

networks:
  shared_edge:
    external: true
    name: fluxa_edge
