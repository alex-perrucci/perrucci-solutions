services:
  marketing:
    build:
      context: .
      dockerfile: services/marketing/Dockerfile
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "127.0.0.1:8098:8000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_MARKETING_API_URL: ${NEXT_PUBLIC_MARKETING_API_URL:-https://api.perruccisolutions.com}
    restart: unless-stopped
    depends_on:
      - marketing
    ports:
      - "127.0.0.1:8088:80"
