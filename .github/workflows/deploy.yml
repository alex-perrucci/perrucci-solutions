name: Deploy VPS
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy configuration
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          if [[ -n "$VPS_HOST" && -n "$VPS_USER" && -n "$VPS_SSH_KEY" ]]; then
            echo 'DEPLOY_CONFIGURED=true' >> "$GITHUB_ENV"
          else
            echo 'DEPLOY_CONFIGURED=false' >> "$GITHUB_ENV"
            echo 'Deploy skipped: configure VPS_HOST, VPS_USER and VPS_SSH_KEY GitHub Secrets.'
          fi

      - name: Configure VPS SSH
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/perrucci_vps
          chmod 600 ~/.ssh/perrucci_vps
          ssh-keygen -y -f ~/.ssh/perrucci_vps >/dev/null || {
            echo 'VPS_SSH_KEY is not a valid OpenSSH private key. Paste the full private key, including BEGIN/END lines.' >&2
            exit 1
          }
          ssh-keyscan -p "${VPS_PORT:-22}" -H "$VPS_HOST" >> ~/.ssh/known_hosts

      - name: Pull and deploy on VPS
        if: env.DEPLOY_CONFIGURED == 'true'
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          ssh -i ~/.ssh/perrucci_vps -o IdentitiesOnly=yes -p "${VPS_PORT:-22}" "$VPS_USER@$VPS_HOST" <<'REMOTE'
            set -euo pipefail
            cd /opt/perrucci-solutions
            git fetch --prune origin main
            git checkout main
            git reset --hard origin/main

            docker compose up -d --build --remove-orphans

            # Perrucci Solutions shares the Fluxa edge proxy. Keep the
            # version-controlled Caddy drop-in synchronized on every deploy.
            if ! docker inspect fluxa-caddy-1 >/dev/null 2>&1; then
              echo 'Shared reverse proxy container fluxa-caddy-1 was not found.' >&2
              exit 1
            fi

            docker exec fluxa-caddy-1 mkdir -p /data/sites-enabled
            docker cp infra/Caddyfile fluxa-caddy-1:/data/sites-enabled/perrucci.caddy
            docker exec fluxa-caddy-1 caddy validate --config /etc/caddy/Caddyfile
            docker exec fluxa-caddy-1 caddy reload --config /etc/caddy/Caddyfile

            docker image prune -f
          REMOTE
